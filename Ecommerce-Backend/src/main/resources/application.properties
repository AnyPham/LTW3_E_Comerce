spring.application.name=ecom-proj

spring.datasource.url=jdbc:h2:mem:Ecommerce
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Cấu hình cho xử lý bất đồng bộ
# Tăng kích thước tối đa của request để xử lý file lớn
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cấu hình timeout cho các request bất đồng bộ
spring.mvc.async.request-timeout=30000

# Cấu hình thread pool cho Tomcat
server.tomcat.threads.max=200
server.tomcat.max-connections=10000
server.tomcat.accept-count=100

# Cấu hình logging cho các tác vụ bất đồng bộ
logging.level.org.springframework.scheduling=INFO
logging.level.com.cart.ecom_proj.service=DEBUG

# Cấu hình cho WebClient (Spring WebFlux)
spring.codec.max-in-memory-size=10MB
